<text x="676" y="565" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#244a42">DATA · 私有工作记录</text>
<text x="676" y="604" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="400" fill="#6a8075">任务 / 日志 / 输入 / 输出</text>
<text x="676" y="648" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#557464">单独备份，不随公开仓库发布</text>
